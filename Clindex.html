</style></head><body><main id="main"></main><button id="fab" data-a="add">+ Add Outfit</button><nav id="bot"></nav>

async function wx(la,lo){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`),j=await r.json();W={t:Math.round(j.current.temperature_2m),hi:Math.round(j.daily.temperature_2m_max[0]),lo:Math.round(j.daily.temperature_2m_min[0]),rain:j.daily.precipitation_probability_max[0]||0,icon:wi(j.current.weather_code)};picks=null;R()}catch(e){}}

const V={
home(){const t=today(),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',hd=`<h1>${g}, Evva</h1>`;

const wt=S.outfits.filter(o=>o.wornDates.includes(t)),ps=getPicks().map(id=>S.outfits.find(o=>o.id==id)).filter(Boolean),ins=S.outfits.some(o=>o.seasons.some(x=>seas().includes(x)));
return`${hd}<p class=sub>What are you wearing today?</p>${wt.length?`<div class=banner>✓ Wearing today: <b>${esc(wt[0].name)}</b></div>`:''}<h2>Try these today</h2>${W?`<div class=banner style="background:var(--bg2);color:var(--tx)">${W.icon} ${W.t}°C now · High ${W.hi}° / Low ${W.lo}°${W.rain>=50?' · ☔ '+W.rain+'% chance of rain':''}</div>`:'<button class=b2 data-a=wx style="margin:0 0 12px">📍 Use my local weather</button>'}<div class=chips>${[['Cold','❄️'],['Cool','🍂'],['Warm','🌤️'],['Hot','☀️']].map(([k,e])=>`<button class="chip ${feelNow()==k?'on':''}" data-a=feel data-i=${k}>${e} ${k}</button>`).join('')}</div><p class=mu style="margin:0 0 12px;font-size:13px">${S.feel&&S.feel.d==today()?'Showing outfits for a '+S.feel.v.toLowerCase()+' day. Tap again to use the weather.':feelNow()?"Matched to today's weather. Tap to override.":'Tap how today feels to adjust ideas.'}</p>${ps.length?`<div class=grid>${ps.map(o=>card(o,`<small class=mu>${last(o)?(stale(o)?'✨ Not worn in 30+ days':'Last worn '+fmt(last(o))):'Not worn yet'}</small><button class=bw data-a=wear data-i=${o.id}>Wear today</button>`)).join('')}</div>`:`<div class=empty><h2>${ins?"You've worn everything recently!":'No fresh recommendations right now.'}</h2><p class=mu>${ins?'':'Tag some outfits as '+seas().join(' or ')+' to see ideas.'}</p><button class=b2 data-a=go data-i=outfits>Browse all outfits</button><button class=b1 data-a=add>Add an outfit</button></div>`}`},

sheet(`<h2>${o?'Edit outfit':'Add outfit'}</h2><label class=pk><div id=pv class=pv>${o&&o.img?`<img src="${U(o.img)}" alt="">`:'<span>📷<br>Add a photo</span>'}</div><input id=fi type=file accept="image/*" hidden></label><label>Name (optional)<input id=fn value="${esc(o?o.name:'')}" placeholder="Fall Campus Outfit"></label><label>Season</label><div class=chips>${ch('s',SE,F.seasons)}</div><label>Where</label><div class=chips>${ch('o',OC,F.occasions)}</div><label>Notes (optional)<textarea id=fo>${esc(o?o.notes:'')}</textarea></label><button id=svb class=b1 data-a=sv>Save Outfit</button>`)}
async function shrink(f){let src,w,h;try{src=await createImageBitmap(f);w=src.width;h=src.height}catch(e){src=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(f)});w=src.naturalWidth;h=src.naturalHeight}const s=Math.min(1,1200/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
const A={wx:()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{S.loc={lat:+p.coords.latitude.toFixed(2),lon:+p.coords.longitude.toFixed(2)};save();wx(S.loc.lat,S.loc.lon)},()=>alert('Location is off. You can still tap how today feels.')):0,feel:i=>{S.feel=S.feel&&S.feel.d==today()&&S.feel.v==i?null:{d:today(),v:i};picks=null;upd()},
pw:()=>{if(!S.outfits.length)return sheet('<h2>Plan my week</h2><p class=mu>Add a few outfits first.</p>');const ds=[1,2,3,4,5,6,7].map(i=>addD(today(),i)).filter(k=>!S.outfits.some(o=>o.plannedDates.includes(k)||o.wornDates.includes(k)));if(!ds.length)return sheet('<h2>Plan my week</h2><p class=mu>The next 7 days are already planned.</p>');PW=[];ds.forEach(k=>{const o=suggest(k,PW.map(p=>p.id));if(o)PW.push({k,id:o.id})});pwv()},
pws:k=>{const p=PW.find(x=>x.k==k),o=suggest(k,PW.map(x=>x.id));if(o)p.id=o.id;pwv()},
pwsave:()=>{PW.forEach(p=>{const o=byId(p.id);if(!o.plannedDates.includes(p.k))o.plannedDates.push(p.k)});cls();upd()},
go:i=>{page=i;R();scrollTo(0,0)},cls,add:()=>formS(),cmv:i=>{const x=P(cm);x.setDate(1);x.setMonth(x.getMonth()+ +i);cm=ymd(x);R()},day:dayS,
ft:(i,el)=>{const[g,x]=i.split(':'),st=g=='s'?fs:fo;st.has(x)?st.delete(x):st.add(x);el.classList.toggle('on');sr()},
ftg:(i,el)=>{const[g,x]=i.split(':'),l=g=='s'?F.seasons:F.occasions,n=l.indexOf(x);n<0?l.push(x):l.splice(n,1);el.classList.toggle('on')},
open:i=>{const o=byId(i);if(!o)return;const lw=last(o),pl=o.plannedDates.filter(d=>d>=today()).sort()[0];sheet(`<div class=dph>${img(o)}</div><h2 style="margin-top:12px">${esc(o.name)}</h2><div>${tags(o)}</div>${o.notes?`<p>${esc(o.notes)}</p>`:''}<p class=mu>${lw?'Last worn '+fmt(lw):'Not worn yet'}${pl?' · Planned '+fmt(pl):''}</p><button class=b1 data-a=wear data-i=${o.id}>Wear Today</button><button class=b2 data-a=plan data-i=${o.id}>Plan Outfit</button><button class=b2 data-a=edit data-i=${o.id}>Edit</button><button class=bd data-a=del data-i=${o.id}>Delete</button>`)},
wear:i=>{const o=byId(i),t=today();if(!o.wornDates.includes(t))o.wornDates.push(t);picks=null;cls();upd()},
plan:i=>sheet(`<h2>Plan outfit</h2><label>Date<input id=pd type=date value="${addD(today(),1)}"></label><button class=b1 data-a=plan2 data-i=${i}>Save</button>`),
plan2:i=>{const o=byId(i),d=$('#pd').value;if(d&&!o.plannedDates.includes(d))o.plannedDates.push(d);cls();upd()},
edit:i=>formS(byId(i)),
del:i=>sheet(`<h2>Delete this outfit?</h2><p class=mu>This will remove the outfit and its associated history.</p><button class=b2 data-a=cls>Cancel</button><button class=bd data-a=del2 data-i=${i}>Delete</button>`),
del2:async i=>{const o=byId(i);S.outfits=S.outfits.filter(x=>x!=o);picks=null;cls();upd();try{if(o.img){await idbDel(o.img);URLS[o.img]=0}}catch(e){}},
pick:k=>sheet(`<h2>Choose an outfit</h2>${S.outfits.length?`<div class=grid>${S.outfits.map(o=>`<div class=oc data-a=pk data-i="${o.id}|${k}"><div class=ph>${img(o)}</div><div class=ib><b>${esc(o.name)}</b></div></div>`).join('')}</div>`:'<p class=mu>Add an outfit first.</p>'}`),
pk:v=>{const[i,k]=v.split('|'),o=byId(i),l=k>today()?o.plannedDates:o.wornDates;if(!l.includes(k))l.push(k);picks=null;upd();dayS(k)},
unset:v=>{const[i,k,ty]=v.split('|'),o=byId(i),l=ty=='p'?o.plannedDates:o.wornDates;l.splice(l.indexOf(k),1);picks=null;upd();dayS(k)},
sv:async()=>{const b=$('#svb');b.disabled=true;b.textContent='Saving…';let im=F.img;if(F.file){try{const bl=await shrink(F.file);im=uid();await idbPut(im,bl);URLS[im]=URL.createObjectURL(bl)}catch(e){alert('Your photo could not be saved: '+(e&&e.message||'unknown error'))}}
const v={name:$('#fn').value.trim()||'Untitled Outfit',notes:$('#fo').value.trim(),seasons:F.seasons,occasions:F.occasions,img:im};if(F.id)Object.assign(byId(F.id),v);else S.outfits.push({id:uid(),createdAt:Date.now(),wornDates:[],plannedDates:[],...v});picks=null;cls();upd()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.i,t)});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;sr()}});
document.addEventListener('change',e=>{if(e.target.id=='fi'&&e.target.files[0]){F.file=e.target.files[0];$('#pv').innerHTML=`<img src="${URL.createObjectURL(F.file)}" alt="">`}});
R();idbAll().then(o=>{for(const k in o)URLS[k]=URL.createObjectURL(o[k]);R()}).catch(()=>{});if(S.loc)wx(S.loc.lat,S.loc.lon);try{navigator.storage&&navigator.storage.persist()}catch(e){}
